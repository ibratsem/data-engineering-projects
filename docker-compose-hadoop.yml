services:
  namenode:
    image: apache/hadoop:3.3.6
    hostname: namenode
    ports:
      - "9870:9870"  # HDFS Web UI
      - "9000:9000"  # HDFS
    environment:
      - CLUSTER_NAME=hadoop-cluster
      - JAVA_HOME=${JAVA_HOME}
    volumes:
      - namenode:/hadoop/dfs/name
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro

  datanode:
    image: apache/hadoop:3.3.6
    hostname: datanode
    depends_on:
      - namenode
    ports:
      - "9864:9864"  # DataNode Web UI
    environment:
      - CLUSTER_NAME=hadoop-cluster
      - JAVA_HOME=${JAVA_HOME}
    volumes:
      - datanode:/hadoop/dfs/data
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro

  resourcemanager:
    image: apache/hadoop:3.3.6
    hostname: resourcemanager
    depends_on:
      - namenode
    ports:
      - "8088:8088"  # YARN Web UI
    environment:
      - CLUSTER_NAME=hadoop-cluster
      - JAVA_HOME=${JAVA_HOME}
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro

  nodemanager:
    image: apache/hadoop:3.3.6
    hostname: nodemanager
    depends_on:
      - resourcemanager
    environment:
      - CLUSTER_NAME=hadoop-cluster
      - JAVA_HOME=${JAVA_HOME}
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro

  spark:
    image: bitnami/spark:3.3.1
    hostname: spark
    environment:
      - SPARK_MASTER=spark://spark:7077
      - SPARK_MODE=master
      - SPARK_HOME=/opt/bitnami/spark
      - JAVA_HOME=${JAVA_HOME}
    ports:
      - "8080:8080"  # Spark Web UI
    depends_on:
      - namenode
      - resourcemanager
    command: >
      bash -c "mkdir -p /var/lib/apt/lists/partial && apt-get update && apt-get install -y rsync && exec /run.sh"
    volumes:
      - spark:/opt/bitnami/spark

volumes:
  namenode:
  datanode:
  spark:
